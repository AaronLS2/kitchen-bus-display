<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f2e6"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Bus buddies">
<title>Bus buddies</title>
<style>
:root{color-scheme:light;--ink:#243d35;--paper:#f8f2e6;--green:#255749;--muted:#63746b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:440px;margin:auto;padding:28px 24px max(26px,env(safe-area-inset-bottom))}.heading{display:flex;justify-content:space-between;align-items:center}.stamp{border:1px solid #b7c2b3;border-radius:50%;width:45px;height:45px;display:grid;place-items:center;font-size:21px;transform:rotate(10deg)}h1{font-family:Georgia,serif;font-size:42px;letter-spacing:-1.8px;line-height:1;margin:12px 0 8px;font-weight:500}.intro{margin:0;color:var(--muted);font-size:15px}.scene{display:block;width:100%;height:auto;margin:22px 0 8px}.status{text-align:center;min-height:91px;padding:8px 0 18px}.status strong{display:block;font-size:21px;font-weight:650;margin-bottom:6px}.status p{font-size:14px;color:var(--muted);margin:0;line-height:1.5}button{font:inherit;width:100%;min-height:61px;border:0;border-radius:18px;cursor:pointer;font-size:17px;font-weight:650;touch-action:manipulation}button:focus-visible{outline:3px solid #e9a443;outline-offset:4px}button:disabled{opacity:.55;cursor:wait}button[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--ink)}.on{background:var(--green);color:white;margin-bottom:12px}.on[aria-pressed=true]{box-shadow:inset 0 0 0 3px #acd6bd}.secondary{display:grid;grid-template-columns:1fr 1fr;gap:12px}.secondary button{background:#e7e6d9;color:var(--ink)}.secondary button:last-child{background:#ede2cf}.note{text-align:center;font-size:12px;line-height:1.5;color:var(--muted);margin:22px 0 0}.error{color:#9c432e!important}.leaf{transform-origin:90px 100px;animation:sway 5s ease-in-out infinite alternate}@keyframes sway{to{transform:rotate(3deg)}}@media(prefers-reduced-motion:reduce){.leaf{animation:none}}@media(max-height:740px){main{padding-top:16px}.scene{max-height:210px;margin-top:12px}h1{font-size:38px}}
</style>
</head>
<body><main>
<div class="heading"><div><h1>Bus buddies</h1><p class="intro">A little help getting out the door.</p></div><span class="stamp" aria-hidden="true">✳</span></div>

<circle cx="111" cy="119" r="3.5" fill="white"/><circle cx="143" cy="119" r="3.5" fill="white"/><ellipse cx="127" cy="135" rx="6" ry="4" fill="#273c36"/>

<path d="M169 75 Q179 64 189 75" stroke="#a4b295" stroke-width="2" fill="none"/><circle cx="353" cy="115" r="3" fill="#e3b662"/><path d="M349 136 h9 M353 132 v9" stroke="#b2bd9d" stroke-width="2"/>
</svg>
<section class="status" aria-live="polite"><strong id="status">Finding the bus stop…</strong><p id="detail">Connecting to your display host.</p></section>
<button class="on" data-mode="on" disabled>Show buses for 30 minutes</button>
<div class="secondary"><button data-mode="off" disabled>Off</button><button data-mode="auto" disabled>Automatic</button></div>
<p class="note">Off takes a break until the next school morning.<br>Automatic follows your usual morning schedule.</p>
</main><script>
const token='__TOKEN__', buttons=[...document.querySelectorAll('button')];
let busy=false;
const title=document.getElementById('status'), detail=document.getElementById('detail');
function render(s){
 title.textContent=s.mode==='on'?'Bus stop is open!':s.mode==='off'?'Bears on a break.':s.wants_on?'Morning, bus buddies!':'All set for school mornings.';
 const until=s.until?new Intl.DateTimeFormat('en-US',{timeZone:s.timezone,hour:'numeric',minute:'2-digit',...(s.mode==='off'?{weekday:'short',month:'short',day:'numeric'}:{})}).format(new Date(s.until)):null;
 detail.className=s.error?'error':'';
 detail.textContent=s.error||(s.pending?'Sending to the display…':(s.mode==='on'?`Back to automatic at ${until}.`:s.mode==='off'?(until?`Back on schedule ${until}.`:'Resting until you choose Automatic.'):s.wants_on?'The display is on its morning schedule.':'The display is resting.'));
 buttons.forEach(b=>{b.disabled=busy;b.setAttribute('aria-pressed',String(b.dataset.mode===s.mode));});
}
function offline(message){title.textContent='Can’t reach the bus stop.';detail.className='error';detail.textContent=message;buttons.forEach(b=>b.disabled=true);}
async function request(path,options){const response=await fetch(path,{...options,signal:AbortSignal.timeout(8000),cache:'no-store'});if(!response.ok)throw new Error('request failed');return response.json();}
async function refresh(){if(busy)return;try{render(await request('/api/status'));}catch{offline('Check home Wi-Fi and that the display host is running.');}}
buttons.forEach(b=>b.addEventListener('click',async()=>{busy=true;buttons.forEach(b=>b.disabled=true);try{const s=await request('/api/mode',{method:'POST',headers:{'Content-Type':'application/json','X-Control-Token':token},body:JSON.stringify({mode:b.dataset.mode})});busy=false;render(s);}catch{busy=false;offline('Couldn’t confirm that change. Reopen this page and try again.');}}));
refresh();setInterval(refresh,3000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
</script></body></html>
